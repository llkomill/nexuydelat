<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blooming Portrait</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07061a;
    --title: #f6d6ec;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { cursor: pointer; -webkit-tap-highlight-color: transparent; }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; mix-blend-mode: screen; }
  /* размытая копия основного холста — даёт мягкое неоновое свечение линий */
  #glow { filter: blur(3px) saturate(1.4) brightness(1.3); opacity: .8; mix-blend-mode: screen; pointer-events: none; }

  #title {
    position: fixed; left: 50%; transform: translateX(-50%);
    width: min(92vw, 52vh); text-align: center; white-space: nowrap;
    font-family: "Cormorant Garamond", "Times New Roman", Georgia, serif;
    font-style: italic; font-weight: 500;
    color: var(--title);
    text-shadow: 0 0 10px rgba(255, 170, 225, .55), 0 0 22px rgba(200, 140, 255, .25);
    pointer-events: none; user-select: none;
  }
  #title span { opacity: 0; display: inline-block; transform: translateY(4px); filter: blur(3px);
    transition: opacity .45s ease, transform .45s ease, filter .45s ease; white-space: pre; }
  #title span.on { opacity: 1; transform: none; filter: none; }

  #replay {
    position: fixed; right: 18px; bottom: 18px; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(246, 214, 236, .25); background: rgba(255, 255, 255, .04);
    color: var(--title); font-size: 18px; line-height: 36px; text-align: center;
    opacity: 0; transition: opacity .6s; pointer-events: none;
  }
  #replay.show { opacity: .7; pointer-events: auto; }

  /* браузеры не дают включить звук без касания — просим нажать один раз */
  #start {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: "Cormorant Garamond", "Times New Roman", Georgia, serif; font-style: italic;
    font-size: 22px; letter-spacing: .04em; color: var(--title);
    text-shadow: 0 0 12px rgba(255, 170, 225, .5);
    opacity: 0; pointer-events: none; transition: opacity .6s;
  }
  #start.show { opacity: .85; pointer-events: auto; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
</style>
</head>
<body>
<canvas id="main"></canvas>
<canvas id="glow"></canvas>
<div id="title"></div>
<div id="replay" title="Повторить">↻</div>
<div id="start">♪ нажми, чтобы начать</div>
<!-- трек: встроенный window.MUSIC_SRC (в portrait.html) или файл music.mp3 рядом со страницей -->
<audio id="music" preload="auto"></audio>

<script src="photo.js"></script>
<script>
(() => {
  // ───────────── настройки ─────────────
  const TITLE = "Some Flowers Bloom In Quiet Places.";
  const DURATION = {
    intro: 1.4,      // сколько секунд только звёздная пыль
    sweep: 6.2,      // за сколько секунд рисунок проявляется сверху вниз
    flight: 2.6,     // время полёта одной частицы к своей точке
    titleAt: 9.4,    // когда начинает печататься надпись
    charStep: 0.055  // пауза между буквами
  };
  const MAX_PARTICLES = 19000;
  const AMBIENT_STARS = 1400;
  // градиент линий сверху вниз: розовый → сиреневый → голубой
  const PALETTE = [[0, [255, 150, 205]], [0.45, [222, 150, 245]], [0.75, [180, 150, 255]], [1, [120, 155, 255]]];

  // контур девушки на фото (координаты исходника 553×556) — отсекает салон машины
  const MASK = [[245,26],[335,26],[385,34],[420,80],[440,150],[452,230],[470,300],[505,345],[534,360],
    [534,540],[22,540],[22,515],[38,440],[95,396],[125,332],[140,262],[148,242],
    [124,236],[108,190],[116,138],[158,122],[170,88],[195,38]];
  const FADE_FROM = 470, FADE_TO = 545; // низ рисунка растворяется, как шея в референсе

  const main = document.getElementById('main');
  const glow = document.getElementById('glow');
  const ctx = main.getContext('2d');
  const gctx = glow.getContext('2d');
  const titleEl = document.getElementById('title');
  const replayEl = document.getElementById('replay');
  const startEl = document.getElementById('start');
  const music = document.getElementById('music');
  const MUSIC_OFFSET = 0; // с какой секунды трека начинать (если вступление длинное)

  // встроенный трек превращаем в Blob — так перемотка работает и в Safari
  const embeddedMusic = typeof window.MUSIC_SRC === 'string' && window.MUSIC_SRC.startsWith('data:');
  if (embeddedMusic) {
    const [head, b64] = window.MUSIC_SRC.split(',');
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    music.src = URL.createObjectURL(new Blob([bytes], { type: head.slice(5).split(';')[0] }));
  } else {
    music.src = 'music.mp3';
  }

  let W, H, layout, particles = [], stars = [], targets = null, t0 = 0;
  const params = new URLSearchParams(location.search);
  const startOffset = parseFloat(params.get('t') || '0');

  // ───────────── обработка фото → точки линий ─────────────
  function gaussian(src, w, h, sigma) {
    const r = Math.ceil(sigma * 3), k = [];
    let sum = 0;
    for (let i = -r; i <= r; i++) { const v = Math.exp(-(i * i) / (2 * sigma * sigma)); k.push(v); sum += v; }
    for (let i = 0; i < k.length; i++) k[i] /= sum;
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let a = 0;
      for (let i = -r; i <= r; i++) a += src[y * w + Math.min(w - 1, Math.max(0, x + i))] * k[i + r];
      tmp[y * w + x] = a;
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let a = 0;
      for (let i = -r; i <= r; i++) a += tmp[Math.min(h - 1, Math.max(0, y + i)) * w + x] * k[i + r];
      out[y * w + x] = a;
    }
    return out;
  }

  function extractLines(img) {
    const w = img.naturalWidth, h = img.naturalHeight;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0);
    const px = x.getImageData(0, 0, w, h).data;
    const lum = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) lum[i] = px[i * 4] * .299 + px[i * 4 + 1] * .587 + px[i * 4 + 2] * .114;

    // мягкая маска фигуры
    x.clearRect(0, 0, w, h);
    x.filter = 'blur(6px)';
    x.fillStyle = '#fff';
    x.beginPath();
    const sx = w / 553, sy = h / 556;
    MASK.forEach(([mx, my], i) => i ? x.lineTo(mx * sx, my * sy) : x.moveTo(mx * sx, my * sy));
    x.closePath(); x.fill();
    x.filter = 'none';
    const mask = x.getImageData(0, 0, w, h).data;

    // Difference of Gaussians: тёмные штрихи светлее окружения → линии «как карандашом»
    const g1 = gaussian(lum, w, h, 0.9);
    const g2 = gaussian(lum, w, h, 2.0);
    const str = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      const fade = 1 - Math.min(1, Math.max(0, (y - FADE_FROM * sy) / ((FADE_TO - FADE_FROM) * sy)));
      for (let xx = 0; xx < w; xx++) {
        const i = y * w + xx;
        str[i] = Math.max(0, g2[i] - g1[i]) * (mask[i * 4] / 255) * fade;
      }
    }
    // оставляем только гребни — линии становятся тонкими, как штрих пера
    const TH = 1.8;
    const on = new Uint8Array(w * h);
    for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {
      const i = y * w + xx, s = str[i];
      if (s <= TH) continue;
      if ((s >= str[i - 1] && s >= str[i + 1]) || (s >= str[i - w] && s >= str[i + w])) on[i] = 1;
    }
    // убираем «веснушки» и шум кожи: короткие обрывки линий не нужны
    const MIN_LEN = 9;
    const pts = [], seen = new Uint8Array(w * h), stack = [];
    for (let i = 0; i < w * h; i++) {
      if (!on[i] || seen[i]) continue;
      const comp = [];
      stack.push(i); seen[i] = 1;
      while (stack.length) {
        const j = stack.pop(); comp.push(j);
        const jx = j % w, jy = (j / w) | 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const nx = jx + dx, ny = jy + dy, n = ny * w + nx;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h || seen[n] || !on[n]) continue;
          seen[n] = 1; stack.push(n);
        }
      }
      if (comp.length < MIN_LEN) continue;
      for (const j of comp) pts.push({ x: j % w, y: (j / w) | 0, s: Math.min(1, (str[j] - TH) / 9) });
    }
    // прореживаем до бюджета частиц, сохраняя сильные линии
    pts.sort((a, b) => (b.s + Math.random() * .35) - (a.s + Math.random() * .35));
    const chosen = pts.slice(0, MAX_PARTICLES);
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    chosen.forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); });
    return { pts: chosen, w, h, minX, maxX, minY, maxY };
  }

  // ───────────── раскладка и частицы ─────────────
  function lerpColor(t) {
    for (let i = 1; i < PALETTE.length; i++) {
      if (t <= PALETTE[i][0]) {
        const [t0_, a] = PALETTE[i - 1], [t1, b] = PALETTE[i];
        const k = (t - t0_) / (t1 - t0_);
        return a.map((v, j) => Math.round(v + (b[j] - v) * k));
      }
    }
    return PALETTE[PALETTE.length - 1][1];
  }

  function computeLayout() {
    // портретная «сцена» 9:16 по центру экрана, как в рилсе
    const stageH = Math.min(H, W * 16 / 9 * 1.0);
    const stageW = Math.min(W, stageH * 9 / 16);
    const sx0 = (W - stageW) / 2, sy0 = (H - stageH) / 2;
    const bw = targets.maxX - targets.minX, bh = targets.maxY - targets.minY;
    const scale = Math.min(stageW * .9 / bw, stageH * .62 / bh);
    const top = sy0 + stageH * .54 - bh * scale / 2;
    const ox = sx0 + (stageW - bw * scale) / 2 - targets.minX * scale;
    const oy = top - targets.minY * scale;
    return { stageW, stageH, sx0, sy0, scale, ox, oy, top };
  }

  function build() {
    particles = targets.pts.map(p => {
      const yn = (p.y - targets.minY) / (targets.maxY - targets.minY);
      return {
        tx: p.x, ty: p.y, col: lerpColor(yn),
        // стартовая «пыль» разбросана по всему экрану
        sx: Math.random(), sy: Math.random(),
        drift: Math.random() * Math.PI * 2,
        delay: DURATION.intro + yn * DURATION.sweep + (Math.random() - .5) * 1.1,
        dur: DURATION.flight * (.65 + Math.random() * .7),
        // точка в «облаке» под линией, куда частица сначала слетается
        cx: (Math.random() - .5) * 110, cy: 15 + Math.random() * 85,
        swirl: (Math.random() - .5) * 2,
        size: .8 + p.s * .5 + Math.random() * .35,
        a: .45 + p.s * .45,
        tw: Math.random() * 6.28
      };
    });
    stars = Array.from({ length: AMBIENT_STARS }, () => ({
      x: Math.random(), y: Math.random(), r: Math.random() * .9 + .3,
      a: Math.random() * .5 + .12, tw: Math.random() * 6.28, sp: .5 + Math.random() * 2,
      vx: (Math.random() - .5) * .004, vy: (Math.random() - .5) * .004,
      pink: Math.random() < .35
    }));
  }

  function resize() {
    W = innerWidth; H = innerHeight;
    // плотность пикселей буфера: retina, но не больше ~3 млн пикселей на кадр
    PR = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(3e6 / (W * H)));
    BW = main.width = Math.ceil(W * PR); BH = main.height = Math.ceil(H * PR);
    frameImg = ctx.createImageData(BW, BH);
    buf = frameImg.data;
    // свечение считаем в 1/4 разрешения — CSS его растягивает и размывает почти бесплатно
    glow.width = Math.ceil(W / 4); glow.height = Math.ceil(H / 4);
    if (targets) layout = computeLayout();
    // надпись над портретом
    if (layout) {
      const fs = Math.min(layout.stageW * .058, 34);
      titleEl.style.fontSize = fs + 'px';
      titleEl.style.top = Math.max(layout.sy0 + 12, layout.top - fs * 3.2) + 'px';
    }
  }

  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  // ───────────── свой пиксельный буфер ─────────────
  // десятки тысяч fillRect за кадр тормозят без GPU, поэтому точки
  // складываются прямо в ImageData (аддитивно — пересечения светятся ярче)
  const DUST = [250, 180, 230];
  let PR, BW, BH, frameImg, buf;

  function plot(x, y, s, r, g, b, a) {
    x *= PR; y *= PR; s *= PR;
    if (s < 1.6) {
      // мелкая точка — размазываем по 2×2 пикселям, чтобы движение было гладким
      const fx = x - .5, fy = y - .5, x0 = Math.floor(fx), y0 = Math.floor(fy);
      const dx = fx - x0, dy = fy - y0, k = a * Math.min(1.4, s * s);
      add(x0, y0, r, g, b, k * (1 - dx) * (1 - dy));
      add(x0 + 1, y0, r, g, b, k * dx * (1 - dy));
      add(x0, y0 + 1, r, g, b, k * (1 - dx) * dy);
      add(x0 + 1, y0 + 1, r, g, b, k * dx * dy);
    } else {
      const n = Math.round(s), x0 = Math.round(x - n / 2), y0 = Math.round(y - n / 2);
      for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) add(x0 + i, y0 + j, r, g, b, a);
    }
  }
  function add(x, y, r, g, b, a) {
    if (x < 0 || y < 0 || x >= BW || y >= BH) return;
    const i = (y * BW + x) * 4;
    buf[i] += r * a; buf[i + 1] += g * a; buf[i + 2] += b * a; // Uint8ClampedArray сам обрежет до 255
  }

  // ───────────── надпись ─────────────
  function setupTitle() {
    titleEl.innerHTML = '';
    [...TITLE].forEach(ch => { const s = document.createElement('span'); s.textContent = ch; titleEl.appendChild(s); });
  }
  function updateTitle(t) {
    const spans = titleEl.children;
    const n = Math.floor((t - DURATION.titleAt) / DURATION.charStep) + 1;
    for (let i = 0; i < spans.length; i++) spans[i].classList.toggle('on', i < n);
    replayEl.classList.toggle('show', n > spans.length + 10);
  }

  // ───────────── кадр ─────────────
  function frame(now) {
    const t = (now - t0) / 1000;
    const { scale, ox, oy } = layout;

    // буфер чёрный: холст наложен в режиме screen, поэтому чёрное = прозрачное
    new Uint32Array(buf.buffer).fill(0xff000000);
    const unit = Math.max(1, scale); // на больших экранах точки крупнее, чтобы линии не рвались

    // фоновая звёздная пыль
    for (const s of stars) {
      const x = ((s.x + s.vx * t) % 1 + 1) % 1 * W, y = ((s.y + s.vy * t) % 1 + 1) % 1 * H;
      const a = s.a * (.55 + .45 * Math.sin(t * s.sp + s.tw));
      if (s.pink) plot(x, y, s.r, 255, 190, 230, a); else plot(x, y, s.r, 220, 215, 255, a);
    }

    // частицы портрета
    for (const p of particles) {
      const tx = ox + p.tx * scale, ty = oy + p.ty * scale;
      const wob = t * .35 + p.drift;
      const fx = p.sx * W + Math.cos(wob) * 14, fy = p.sy * H + Math.sin(wob * 1.3) * 14;
      let k = (t - p.delay) / p.dur;
      let x, y, a, mix = 0;
      if (k <= 0) {
        // ещё летает как пыль
        x = fx; y = fy; a = .22;
      } else {
        k = Math.min(1, k);
        // фаза 1: слетаются в розовое облако под проявляющейся линией
        // фаза 2: из облака садятся точно на штрих
        const SPLIT = .58;
        const cxp = tx + p.cx * unit, cyp = ty + p.cy * unit;
        const sw = Math.sin(t * 1.7 + p.tw) * 6 * p.swirl;
        if (k < SPLIT) {
          const e = ease(k / SPLIT);
          x = fx + (cxp - fx) * e + sw * e; y = fy + (cyp - fy) * e;
          a = .22 + .3 * e;
        } else {
          const e = ease((k - SPLIT) / (1 - SPLIT)), inv = 1 - e;
          x = cxp + (tx - cxp) * e + sw * inv; y = cyp + (ty - cyp) * e;
          a = .52 + (p.a - .52) * e;
          mix = e;
        }
        if (k >= 1) a *= .82 + .18 * Math.sin(t * 2.2 + p.tw);
      }
      const c = p.col, sz = (k >= 1 ? p.size : p.size * .85) * unit;
      plot(x, y, sz,
        DUST[0] + (c[0] - DUST[0]) * mix, DUST[1] + (c[1] - DUST[1]) * mix, DUST[2] + (c[2] - DUST[2]) * mix, a);
    }

    ctx.putImageData(frameImg, 0, 0);
    gctx.clearRect(0, 0, glow.width, glow.height);
    gctx.drawImage(main, 0, 0, glow.width, glow.height);

    updateTitle(t);
    requestAnimationFrame(frame);
  }

  let hasMusic = false;

  function restart() {
    build();
    setupTitle();
    startEl.classList.remove('show');
    if (!hasMusic) {
      t0 = performance.now() - startOffset * 1000;
      return Promise.resolve();
    }
    // пыль ждёт, пока трек реально заиграет (по сети он может догружаться) — так звук не отстаёт
    t0 = performance.now() + 3.6e6;
    music.currentTime = MUSIC_OFFSET + startOffset;
    return music.play().then(() => { t0 = performance.now() - startOffset * 1000; });
  }

  // есть ли трек: встроенный или music.mp3 рядом
  async function detectMusic() {
    if (embeddedMusic) return true;
    // на сайте (GitHub Pages и т.п.) просто спрашиваем сервер — не зависит от скорости загрузки
    if (location.protocol.startsWith('http')) {
      try {
        const res = await fetch(music.currentSrc || music.src, { method: 'HEAD', cache: 'no-store' });
        return res.ok;
      } catch (e) { /* ниже проверим через сам <audio> */ }
    }
    return new Promise(resolve => {
      if (music.error) return resolve(false);
      if (music.readyState >= 1) return resolve(true);
      music.addEventListener('loadedmetadata', () => resolve(true), { once: true });
      music.addEventListener('error', () => resolve(false), { once: true });
      // iPhone не грузит аудио до касания — если ошибки нет, считаем, что трек есть
      setTimeout(() => resolve(!music.error), 4000);
    });
  }

  // play() не удался: либо браузер ждёт касания, либо файл не играется — тогда без звука
  function onPlayFailed(err) {
    if (err && err.name === 'NotAllowedError') return startEl.classList.add('show');
    console.warn('music.mp3 не воспроизводится, запускаю без звука:', err);
    hasMusic = false;
    restart();
  }

  // ───────────── старт ─────────────
  const img = new Image();
  img.onload = async () => {
    targets = extractLines(img);
    resize();
    // пока ждём — пыль уже плавает, а сборка «на паузе» (время далеко в минусе)
    build();
    setupTitle();
    t0 = performance.now() + 3.6e6;
    await (document.fonts ? document.fonts.ready : Promise.resolve());
    requestAnimationFrame(frame);

    hasMusic = await detectMusic();
    if (!hasMusic) console.info('music.mp3 не найден рядом со страницей — анимация без звука');
    // автозапуск со звуком браузер может запретить — тогда ждём одно нажатие
    restart().catch(onPlayFailed);
  };
  img.src = window.PHOTO_SRC;

  addEventListener('resize', resize);
  addEventListener('click', () => { if (targets) restart().catch(onPlayFailed); });
})();
</script>
</body>
</html>
